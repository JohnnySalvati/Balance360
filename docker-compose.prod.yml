# Stack de producción para la VM, detrás del reverse proxy nginx (srv-nginx, .9).
# nginx termina el HTTPS y proxea a esta VM por HTTP en el puerto 8000.
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # El 5432 NO se publica: la base solo vive en la red interna del compose.

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Los certificados ARCA no entran a la imagen (.dockerignore los excluye):
      # se montan desde el disco de la VM, solo lectura. Las rutas *_KEY_PATH /
      # *_CERT_PATH del .env deben apuntar a /app/certs/...
      - ./certs:/app/certs:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"   # expuesto en la LAN para que el nginx de .9 lo alcance

volumes:
  postgres_data:
