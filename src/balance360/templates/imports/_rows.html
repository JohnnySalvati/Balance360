{% if rows %}
{% for row in rows %}
<tr id="import-row-{{ row.id }}" class="hover:bg-gray-50">
    <td class="px-3 py-2 select-col w-8">
        <input type="checkbox" name="row_ids" value="{{ row.id }}" class="row-check">
    </td>
    <td class="px-3 py-2">
        <input type="date" name="transaction_date" value="{{ row.date or '' }}"
               class="border rounded px-2 py-1 text-xs">
    </td>
    <td class="px-3 py-2">
        <input type="text" name="description" value="{{ row.description }}"
               class="border rounded px-2 py-1 text-xs w-full min-w-[12rem]">
    </td>
    <td class="px-3 py-2 text-right">
        <input type="number" step="0.01" name="amount" value="{{ row.debit or row.credit or '' }}"
               class="border rounded px-2 py-1 text-xs w-28 text-right">
    </td>
    <td class="px-3 py-2">
        <select name="type" class="border rounded px-2 py-1 text-xs">
            <option value="expense" {% if row.credit is none %}selected{% endif %}>Egreso</option>
            <option value="income" {% if row.credit is not none %}selected{% endif %}>Ingreso</option>
        </select>
    </td>
    <td class="px-3 py-2">
        <select name="account_id" class="border rounded px-2 py-1 text-xs">
            {% for acc in accounts %}
            <option value="{{ acc.id }}" {% if acc.id == row.account_id %}selected{% endif %}>{{ acc.name }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-3 py-2 text-xs text-gray-400">{{ row.reason }}</td>
    <td class="px-3 py-2 row-actions">
        <div class="flex justify-end gap-2 items-center">
            <button hx-post="/imports/rows/{{ row.id }}/import"
                    hx-include="#import-row-{{ row.id }}"
                    hx-target="#import-row-{{ row.id }}"
                    hx-swap="outerHTML"
                    class="bg-green-600 text-white px-3 py-1 rounded text-xs hover:bg-green-700">
                Importar
            </button>
            <button data-confirm-delete
                    hx-post="/imports/rows/{{ row.id }}/discard"
                    hx-trigger="confirmedDelete"
                    hx-target="#import-row-{{ row.id }}"
                    hx-swap="outerHTML"
                    class="text-red-500 hover:text-red-700 text-xs">
                Descartar
            </button>
        </div>
    </td>
</tr>
{% endfor %}
{% else %}
<tr><td colspan="8" class="px-4 py-12 text-center text-gray-400 text-sm">No hay filas para revisar. 🎉</td></tr>
{% endif %}
