{% set type_labels = {"income": "Ingreso", "expense": "Egreso"} %}
<tr id="rule-row-{{ r.id }}" class="hover:bg-gray-50">
    <td class="px-4 py-3 font-mono text-xs text-gray-700">{{ r.pattern }}</td>
    <td class="px-4 py-3">
        <span class="px-2 py-1 rounded text-xs font-semibold
            {% if r.transaction_type.value == 'income' %}bg-green-100 text-green-700
            {% else %}bg-red-100 text-red-700{% endif %}">
            {{ type_labels[r.transaction_type.value] }}
        </span>
    </td>
    <td class="px-4 py-3 text-gray-500">{{ r.category.name if r.category else '—' }}</td>
    <td class="px-4 py-3 text-gray-500">{{ r.entity.name if r.entity else '—' }}</td>
    <td class="px-4 py-3 text-gray-500">{{ r.contact.name if r.contact else '—' }}</td>
    <td class="px-4 py-3 text-center text-gray-500">{{ '✓' if r.is_transfer else '—' }}</td>
    <td class="px-4 py-3 text-right">
        <div class="flex justify-end gap-3">
            <button hx-get="/import-rules/{{ r.id }}/edit-form"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-blue-500 hover:text-blue-700 text-xs">✎</button>
            <button hx-delete="/import-rules/{{ r.id }}"
                    hx-target="#rule-row-{{ r.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="¿Eliminar la regla '{{ r.pattern }}'?"
                    class="text-red-400 hover:text-red-600 text-xs">✕</button>
        </div>
    </td>
</tr>
