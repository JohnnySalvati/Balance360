{% extends "base.html" %}

{% block content %}
<div class="shrink-0 flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Reglas de clasificación</h1>
    <span class="text-xs text-gray-400">Las reglas nuevas se crean clasificando transacciones</span>
</div>

<div class="shrink-0 mb-3">
    <input type="text"
           name="pattern"
           placeholder="Filtrar por patrón..."
           class="border rounded px-3 py-2 text-sm w-72"
           hx-get="/import-rules/rows"
           hx-target="#tbody"
           hx-trigger="keyup changed delay:300ms"
           hx-include="this">
</div>

<div class="flex-1 overflow-y-auto bg-white rounded shadow">
    <table class="w-full text-sm">
        <thead class="sticky top-0 z-10 bg-gray-100 text-left text-gray-600 uppercase text-xs">
            <tr>
                <th class="px-4 py-3">Patrón</th>
                <th class="px-4 py-3">Tipo</th>
                <th class="px-4 py-3">Categoría</th>
                <th class="px-4 py-3">Entidad</th>
                <th class="px-4 py-3">Contacto</th>
                <th class="px-4 py-3">Transf.</th>
                <th class="px-4 py-3"></th>
            </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-gray-200"
               hx-trigger="refreshRows from:body"
               hx-get="/import-rules/rows"
               hx-target="#tbody"
               hx-swap="innerHTML">
            {% for r in import_rules %}
            {% include "import_rules/_row.html" %}
            {% endfor %}
        </tbody>
    </table>
</div>

<div id="modal"></div>
{% endblock %}
