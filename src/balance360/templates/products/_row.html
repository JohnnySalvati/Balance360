<tr id="prod-row-{{ p.id }}" class="hover:bg-gray-200">
    <td class="px-4 py-3 font-medium text-gray-800">{{ p.name }}</td>
    <td class="px-4 py-3 text-gray-500">{{ p.margin }}%</td>
    <td class="px-4 py-3">
        {% if p.track_serial %}
        <span class="bg-purple-200 text-purple-800 text-xs px-2 py-0.5 rounded">Sí</span>
        {% else %}
        <span class="text-gray-300 text-xs">—</span>
        {% endif %}
    </td>
    <td class="px-4 py-3 text-right">
        <div class="flex justify-end gap-3">
            <button hx-get="/config/products/{{ p.id }}/edit-form"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-blue-500 hover:text-blue-800 text-xs">✎</button>
            <button hx-delete="/config/products/{{ p.id }}"
                    hx-trigger="confirmedDelete"
                    data-confirm-delete
                    hx-target="#prod-row-{{ p.id }}"
                    hx-swap="outerHTML"
                    
                    class="text-red-400 hover:text-red-600 text-xs">✕</button>
        </div>
    </td>
</tr>
