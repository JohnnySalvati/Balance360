{% set is_edit = user is defined and user %}
{% set action_url = "/config/users/" ~ user.id if is_edit else "/config/users/" %}
{% set title = "Editar usuario" if is_edit else "Nuevo usuario" %}

<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">{{ title }}</h2>
            <button hx-get="/config/users/close-modal"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>

        <form {% if is_edit %}hx-patch="{{ action_url }}"{% else %}hx-post="{{ action_url }}"{% endif %}
              hx-target="#modal"
              hx-swap="outerHTML"
              class="flex flex-col gap-3">

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Nombre completo</label>
                <input type="text" name="full_name" required maxlength="30"
                       value="{{ user.full_name if is_edit else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Email</label>
                <input type="email" name="email" required maxlength="50"
                       value="{{ user.email if is_edit else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            {% if not is_edit %}
            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Contraseña</label>
                <input type="password" name="password" required
                       class="border rounded px-3 py-2 text-sm">
            </div>
            {% endif %}

            {% if is_edit %}
            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_active" id="is_active" value="true"
                       {% if user.is_active %}checked{% endif %}
                       class="rounded border-gray-300">
                <label for="is_active" class="text-sm text-gray-700">Usuario activo</label>
            </div>
            {% endif %}

            <div class="flex justify-end gap-2 mt-2">
                <button type="button"
                        hx-get="/config/users/close-modal"
                        hx-target="#modal"
                        hx-swap="outerHTML"
                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">
                    Cancelar
                </button>
                <button type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
