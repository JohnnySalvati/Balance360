{% if by_category %}
<div class="relative" style="height: 280px;">
    <canvas id="categoryChart"></canvas>
</div>
<script>
(function () {
    const catLabels  = {{ by_category | map(attribute='name') | list | tojson }};
    const catAmounts = {{ by_category | map(attribute='amount') | map('float') | list | tojson }};
    const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'];
    const money = v => '$ ' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const el = document.getElementById('categoryChart');
    if (el && window.Chart) {
        const existing = Chart.getChart(el);
        if (existing) existing.destroy();
        new Chart(el, {
            type: 'doughnut',
            data: {
                labels: catLabels,
                datasets: [{ data: catAmounts, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12 } },
                    tooltip: { callbacks: { label: c => c.label + ': ' + money(c.parsed) } }
                }
            }
        });
    }
})();
</script>
{% else %}
<div class="flex items-center justify-center text-gray-400 text-sm" style="height: 280px;">
    Sin egresos en el período.
</div>
{% endif %}
