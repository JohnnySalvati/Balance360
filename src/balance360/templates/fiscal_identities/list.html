{% extends "base.html" %}

{% block content %}
<div class="shrink-0 flex justify-between items-center mb-6">
    <div>
        <h1 class="text-2xl font-bold">Identidades fiscales</h1>
        <p class="text-sm text-gray-500">Datos fiscales de emisión (CUIT, condición IVA, IIBB).</p>
    </div>
    <div class="flex gap-2">
        <button hx-get="/config/fiscal_identities/new-form"
                hx-target="#modal"
                hx-swap="outerHTML"
                class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">
            + Nueva
        </button>
        <a href="/config/" class="text-sm text-blue-600 hover:underline self-center">← Configuración</a>
    </div>
</div>

<div class="flex-1 overflow-y-auto bg-white rounded shadow">
    <table class="w-full text-sm">
        <thead class="sticky top-0 z-10 bg-gray-50 text-left text-gray-500 uppercase text-xs">
            <tr>
                <th class="px-4 py-3">Razón Social</th>
                <th class="px-4 py-3">CUIT</th>
                <th class="px-4 py-3">Condición IVA</th>
                <th class="px-4 py-3 text-right">Alícuota IIBB</th>
                <th class="px-4 py-3"></th>
            </tr>
        </thead>
        <tbody id="fi-tbody" class="divide-y divide-gray-100"
               hx-trigger="refreshFiscalIdentities from:body"
               hx-get="/config/fiscal_identities/rows"
               hx-target="#fi-tbody"
               hx-swap="innerHTML">
            {% include "fiscal_identities/_rows.html" %}
        </tbody>
    </table>
</div>

<div id="modal"></div>
{% endblock %}
