<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

    <nav class="bg-white shadow px-6 py-4 flex gap-6 shrink-0">
        <a href="/" class="font-bold text-blue-600">Balance360</a>
        <a href="/transactions" class="hover:text-blue-600">Transacciones</a>
        <a href="/invoices/?invoice_type=purchase" class="hover:text-blue-600">Comprobantes</a>
        <a href="/reports" class="hover:text-blue-600">Reportes</a>
        <a href="/stock/" class="hover:text-blue-600">Stock</a>
        <a href="/config" class="hover:text-blue-600">Configuración</a>
    </nav>

    <main class="flex-1 overflow-hidden p-6 flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast -->
    <div id="toast"
         class="fixed bottom-6 right-6 z-50 hidden px-4 py-3 rounded shadow-lg text-sm text-white transition-opacity duration-300">
    </div>

    <script>
        function showToast(message, type = "error") {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = toast.className.replace(/bg-\w+-\d+/g, "");
            toast.classList.add(type === "error" ? "bg-red-600" : "bg-green-600");
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 4000);
        }

        document.body.addEventListener("showToast", (e) => {
            showToast(e.detail.message, e.detail.type || "error");
        });

        // Confirm-on-second-click para botones con data-confirm-delete
        document.body.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-confirm-delete]");
            if (!btn) return;

            if (btn.dataset.confirming) {
                // Segundo click — disparar el request HTMX
                clearTimeout(btn._confirmTimer);
                delete btn.dataset.confirming;
                btn.textContent = btn.dataset.originalText;
                btn.classList.remove("text-orange-500");
                htmx.trigger(btn, "confirmedDelete");
            } else {
                // Primer click — pedir confirmación
                e.preventDefault();
                btn.dataset.confirming = "true";
                btn.dataset.originalText = btn.textContent;
                btn.textContent = "¿Confirmás?";
                btn.classList.add("text-orange-500");
                btn._confirmTimer = setTimeout(() => {
                    delete btn.dataset.confirming;
                    btn.textContent = btn.dataset.originalText;
                    btn.classList.remove("text-orange-500");
                }, 3000);
            }
        });
    </script>

</body>
</html>
