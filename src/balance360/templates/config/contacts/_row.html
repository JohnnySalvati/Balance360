{% set type_labels = {"customer": "Cliente", "supplier": "Proveedor", "both": "Ambos"} %}
<tr id="con-row-{{ c.id }}" class="hover:bg-gray-200">
    <td class="px-4 py-3 font-medium text-gray-800">{{ c.name }}</td>
    <td class="px-4 py-3 text-gray-500">{{ type_labels[c.contact_type.value] }}</td>
    <td class="px-4 py-3 text-gray-400">{{ c.tax_id | cuit or '—' }}</td>
    <td class="px-4 py-3 text-right">
        <div class="flex justify-end gap-3">
            <button hx-get="/config/contacts/{{ c.id }}/edit-form"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-blue-500 hover:text-blue-800 text-xs">✎</button>
            <button hx-delete="/config/contacts/{{ c.id }}"
                    hx-trigger="confirmedDelete"
                    data-confirm-delete
                    hx-target="#con-row-{{ c.id }}"
                    hx-swap="outerHTML"
                    
                    class="text-red-400 hover:text-red-600 text-xs">✕</button>
        </div>
    </td>
</tr>
