{% set is_edit = category is defined and category %}
{% set action_url = "/config/categories/" ~ category.id if is_edit else "/config/categories/" %}
{% set title = "Editar categoría" if is_edit else "Nueva categoría" %}

<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">{{ title }}</h2>
            <button hx-get="/config/categories/close-modal"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>

        <form {% if is_edit %}hx-patch="{{ action_url }}"{% else %}hx-post="{{ action_url }}"{% endif %}
              hx-target="#modal"
              hx-swap="outerHTML"
              class="flex flex-col gap-3">

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Nombre</label>
                <input type="text" name="name" required maxlength="30"
                       value="{{ category.name if is_edit else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Categoría padre</label>
                <select name="parent_id" class="border rounded px-3 py-2 text-sm">
                    <option value="">— Ninguna (raíz) —</option>
                    {% for c in categories %}
                    {% if not is_edit or c.id != category.id %}
                    <option value="{{ c.id }}" {% if is_edit and category.parent_id == c.id %}selected{% endif %}>
                        {{ '   ' * c.depth }}{{ c.name }}
                    </option>
                    {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Descripción</label>
                <input type="text" name="description" maxlength="60"
                       value="{{ category.description if is_edit and category.description else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button type="button"
                        hx-get="/config/categories/close-modal"
                        hx-target="#modal"
                        hx-swap="outerHTML"
                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">
                    Cancelar
                </button>
                <button type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-800">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
