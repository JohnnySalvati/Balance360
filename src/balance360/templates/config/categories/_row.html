<tr id="cat-row-{{ c.id }}" class="hover:bg-gray-200">
    <td class="px-4 py-3 font-medium {% if not c.parent_id %}text-gray-800{% else %}text-gray-600{% endif %}"
        style="padding-left: {{ 1 + c.depth * 1.5 }}rem">
        {{ c.name }}
    </td>
    <td class="px-4 py-3 text-gray-500">{{ c.parent.name if c.parent else '—' }}</td>
    <td class="px-4 py-3 text-gray-400">{{ c.description or '—' }}</td>
    <td class="px-4 py-3 text-right">
        <div class="flex justify-end gap-3">
            <button hx-get="/config/categories/{{ c.id }}/edit-form"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-blue-500 hover:text-blue-800 text-xs">✎</button>
            <button hx-delete="/config/categories/{{ c.id }}"
                    hx-trigger="confirmedDelete"
                    data-confirm-delete
                    hx-target="#cat-row-{{ c.id }}"
                    hx-swap="outerHTML"
                    
                    class="text-red-400 hover:text-red-600 text-xs">✕</button>
        </div>
    </td>
</tr>
