{% set type_labels = {"bank": "Banco", "cash": "Efectivo", "wallet": "Billetera", "credit_card": "Tarjeta de crédito"} %}
<tr id="acc-row-{{ a.id }}" class="hover:bg-gray-50">
    <td class="px-4 py-3 font-medium text-gray-800">{{ a.name }}</td>
    <td class="px-4 py-3 text-gray-500">{{ type_labels[a.type.value] }}</td>
    <td class="px-4 py-3 text-gray-500">{{ a.currency.code }}</td>
    <td class="px-4 py-3 text-right">
        <div class="flex justify-end gap-3">
            <button hx-get="/config/accounts/{{ a.id }}/edit-form"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-blue-500 hover:text-blue-700 text-xs">✎</button>
            <button hx-delete="/config/accounts/{{ a.id }}"
                    hx-trigger="confirmedDelete"
                    data-confirm-delete
                    hx-target="#acc-row-{{ a.id }}"
                    hx-swap="outerHTML"
                    
                    class="text-red-400 hover:text-red-600 text-xs">✕</button>
        </div>
    </td>
</tr>
