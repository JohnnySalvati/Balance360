{% extends "base.html" %}

{% block content %}
<div class="max-w-lg">
    <div class="flex items-center gap-3 mb-6">
        <a href="/config/" class="text-gray-400 hover:text-gray-600 text-sm">← Configuración</a>
        <h1 class="text-2xl font-bold">Parámetros del sistema</h1>
    </div>

    <div class="bg-white rounded shadow p-6">
        <form hx-patch="/config/app-config/"
              hx-target="#toast-target"
              hx-swap="none">

            <p class="text-sm text-gray-400 mb-6">
                No hay parámetros configurables por el momento.
            </p>

            <button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-800">
                Guardar
            </button>
        </form>
    </div>
</div>
<div id="toast-target"></div>
{% endblock %}
