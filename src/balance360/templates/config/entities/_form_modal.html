{% set is_edit = entity is defined and entity %}
{% set action_url = "/config/entities/" ~ entity.id if is_edit else "/config/entities/" %}
{% set title = "Editar entidad" if is_edit else "Nueva entidad" %}

<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">{{ title }}</h2>
            <button hx-get="/config/entities/close-modal"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>

        <form {% if is_edit %}hx-patch="{{ action_url }}"{% else %}hx-post="{{ action_url }}"{% endif %}
              hx-target="#modal"
              hx-swap="outerHTML"
              class="flex flex-col gap-3">

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Nombre</label>
                <input type="text" name="name" required maxlength="30"
                       value="{{ entity.name if is_edit else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">CUIT</label>
                <input type="text" name="tax_id" maxlength="13"
                       value="{{ entity.tax_id if is_edit and entity.tax_id else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Condición IVA</label>
                <select name="condicion_iva" required class="border rounded px-3 py-2 text-sm">
                    {% for c in condicion_iva %}
                    <option value="{{ c.name }}"
                            {% if is_edit and entity.condicion_iva == c %}selected{% endif %}>
                        {{ c.name | replace('_', ' ') | title }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Alícuota IIBB (%)</label>
                <input type="number" name="iibb_rate" step="0.01" min="0"
                       value="{{ entity.iibb_rate if is_edit else '0' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button type="button"
                        hx-get="/config/entities/close-modal"
                        hx-target="#modal"
                        hx-swap="outerHTML"
                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">
                    Cancelar
                </button>
                <button type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
