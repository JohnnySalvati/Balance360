{% set is_edit = currency is defined and currency %}
{% set action_url = "/config/currencies/" ~ currency.id if is_edit else "/config/currencies/" %}
{% set title = "Editar moneda" if is_edit else "Nueva moneda" %}

<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">{{ title }}</h2>
            <button hx-get="/config/currencies/close-modal"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>

        <form {% if is_edit %}hx-patch="{{ action_url }}"{% else %}hx-post="{{ action_url }}"{% endif %}
              hx-target="#modal"
              hx-swap="outerHTML"
              class="flex flex-col gap-3">

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Código (ej: USD, ARS)</label>
                <input type="text" name="code" required maxlength="5"
                       value="{{ currency.code if is_edit else '' }}"
                       class="border rounded px-3 py-2 text-sm uppercase">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Nombre</label>
                <input type="text" name="name" required maxlength="50"
                       value="{{ currency.name if is_edit else '' }}"
                       class="border rounded px-3 py-2 text-sm">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_bond" id="is_bond" value="true"
                       {% if is_edit and currency.is_bond %}checked{% endif %}
                       class="rounded border-gray-300">
                <label for="is_bond" class="text-sm text-gray-700">Es un bono</label>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_index" id="is_index" value="true"
                       {% if is_edit and currency.is_index %}checked{% endif %}
                       class="rounded border-gray-300">
                <label for="is_index" class="text-sm text-gray-700">Es un índice (ej: UVA)</label>
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button type="button"
                        hx-get="/config/currencies/close-modal"
                        hx-target="#modal"
                        hx-swap="outerHTML"
                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">
                    Cancelar
                </button>
                <button type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-800">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
