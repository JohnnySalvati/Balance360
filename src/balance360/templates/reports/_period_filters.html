<form method="get" class="bg-white rounded shadow p-4 flex gap-4 items-end">
    <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Entidad</label>
        <select name="entity_id" class="border rounded px-3 py-2 text-sm">
            <option value="">Todas</option>
            {% for e in entities %}
            <option value="{{ e.id }}" {% if e.id|string == selected_entity_id %}selected{% endif %}>{{ e.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Año</label>
        <select name="year" class="border rounded px-3 py-2 text-sm">
            <option value="">Todos</option>
            {% for y in available_years %}
            <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Desde</label>
        <input type="date" name="date_from" value="{{ date_from }}" class="border rounded px-3 py-2 text-sm">
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Hasta</label>
        <input type="date" name="date_to" value="{{ date_to }}" class="border rounded px-3 py-2 text-sm">
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
        Filtrar
    </button>
</form>
