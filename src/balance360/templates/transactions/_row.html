{% set type_labels = {"income": "Ingreso", "expense": "Egreso"} %}
{% set unclassified = not t.is_manual and not t.applied_rule %}
<tr class="{{ 'bg-yellow-50 hover:bg-yellow-100' if unclassified else 'hover:bg-gray-50' }}"
    id="row-{{ t.id }}"
    hx-patch="/transactions/{{ t.id }}/classify"
    hx-target="#row-{{ t.id }}"
    hx-swap="outerHTML"
    hx-trigger="change"
    hx-include="#row-{{ t.id }}">
    <td class="px-4 py-3">{{ t.date }}</td>
    <td class="px-4 py-3">{{ t.description }}</td>
    <td class="px-4 py-3">
        <span class="px-2 py-1 rounded text-xs font-semibold
            {% if t.type.value == 'income' %}bg-green-100 text-green-700
            {% else %}bg-red-100 text-red-700{% endif %}">
            {{ type_labels[t.type.value] }}
        </span>
        {% if t.is_transfer %}
        <span class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-700 ml-1">Transf.</span>
        {% endif %}
    </td>
    <td class="px-4 py-3 text-right">{{ t.amount | amount }}</td>
    <td class="px-4 py-3">{{ t.account.name }}</td>
    <td class="px-4 py-3">
        <select name="entity_id" class="border rounded px-2 py-1 text-sm w-full">
            <option value="">-</option>
            {% for e in entities %}
            <option value="{{ e.id }}" {% if t.entity and t.entity.id == e.id %}selected{% endif %}>{{ e.name }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-4 py-3">
        <select name="contact_id" class="border rounded px-2 py-1 text-sm w-full">
            <option value="">-</option>
            {% for c in contacts %}
            <option value="{{ c.id }}" {% if t.contact and t.contact.id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-4 py-3">
        <select name="category_id" class="border rounded px-2 py-1 text-sm w-full">
            <option value="">-</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if t.category and t.category.id == c.id %}selected{% endif %}>{{ '   ' * c.depth }}{{ c.name }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-4 py-3">
        <div class="flex items-center gap-3">
            <input type="checkbox" name="is_transfer" value="true" {% if t.is_transfer %}checked{% endif %} title="Es transferencia">
            <input type="checkbox" name="create_rule" value="true" checked title="Crear regla">
            <button type="button"
                    hx-get="/transactions/{{ t.id }}/edit-form"
                    hx-target="#modal"
                    hx-swap="outerHTML"
                    class="text-blue-500 hover:text-blue-700 text-xs"
                    title="Editar">✎</button>
            <button type="button"
                    hx-delete="/transactions/{{ t.id }}"
                    hx-target="#row-{{ t.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="¿Eliminar esta transacción?"
                    class="text-red-400 hover:text-red-600 text-xs"
                    title="Eliminar">✕</button>
        </div>
    </td>
</tr>
