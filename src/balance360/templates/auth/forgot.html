{% extends "auth/_layout.html" %}
{% block title %}Recuperar la contraseña{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold mb-1">Recuperar la contraseña</h1>
<p class="text-sm text-muted mb-4">
    Poné tu dirección y te mandamos un link para elegir una nueva. Vale una hora.
</p>

<form method="post" action="/forgot-password"
      class="bg-surface border border-line rounded-[10px] p-4 flex flex-col gap-3.5">

    {% if error %}
    <p class="bg-[#fdecea] text-[#c0392b] rounded px-3 py-2 text-sm">{{ error }}</p>
    {% endif %}

    <div class="flex flex-col gap-1">
        <label for="email" class="text-xs text-muted">Email</label>
        <input id="email" type="email" name="email" required autofocus autocomplete="email"
               value="{{ email or '' }}"
               class="w-full border border-line rounded px-3 py-2 text-sm">
    </div>

    <button type="submit"
            class="w-full bg-accent hover:bg-accentdark text-white rounded px-4 py-2.5 text-sm
                   font-medium mt-1">
        Mandame el link
    </button>
</form>

<p class="text-sm text-muted mt-4">
    <a href="/login/" class="text-accent">Volver</a>
</p>
{% endblock %}
