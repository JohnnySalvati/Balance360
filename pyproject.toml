[project]
name = "balance360"
version = "0.1.0"
description = "Multi-entity personal finance manager"
readme = "README.md"
authors = [
    { name = "MiguelSalvati", email = "miguelsalvati@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2.0",
    "jinja2",
    "python-multipart",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[project.scripts]
balance360 = "balance360:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errores pycodestyle, pyflakes, isort

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
