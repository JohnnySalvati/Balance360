[project]
name = "balance360"
version = "0.1.0"
description = "Multi-entity personal finance manager"
readme = "README.md"
authors = [
    { name = "MiguelSalvati", email = "miguelsalvati@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2",
    "python-multipart",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "rapidfuzz>=3.14.5",
    "cryptography>=48.0.0",
    "zeep>=4.3.2",
    "pdfplumber>=0.11.9",
    "pypdfium2>=4.30",
    "pillow>=10",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt==4.0.1",
    "httpx>=0.28.1",
    "weasyprint>=69.0",
    "segno>=1.6.6",
]

# Grupo y no extra: `uv sync` y `uv run` instalan el grupo `dev` solos, y el Dockerfile lo
# deja afuera con `--no-dev`. Como extra no lo instalaba nadie, y `uv run pytest` terminaba
# corriendo un pytest de fuera del venv, sin las dependencias del proyecto.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[project.scripts]
balance360 = "balance360:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errores pycodestyle, pyflakes, isort

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.format]
line-ending = "lf"
